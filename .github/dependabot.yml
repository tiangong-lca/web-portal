version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    groups:
      next-react:
        patterns: [next, "@next/*", react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      storybook:
        patterns: [storybook, "@storybook/*", msw, msw-storybook-addon]
        update-types: [minor, patch]
      browser-testing:
        patterns:
          [vitest, "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/playwright"]
        update-types: [minor, patch]
      styles:
        patterns: [tailwindcss, "@tailwindcss/*", tailwind-merge, tw-animate-css]
        update-types: [minor, patch]
      oxlint:
        patterns: [oxlint, oxlint-tsgolint]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:20"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
