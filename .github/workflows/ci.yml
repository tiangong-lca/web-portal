name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit gates
        run: pnpm check
      - name: Audit vulnerabilities
        run: pnpm check:vulnerabilities

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The checker is a generated public snapshot: the authoritative repository is private, so CI
      # verifies the committed bytes against the manifest instead of checking it out.
      - name: Verify the vendored shared SEO checker
        run: python3 scripts/verify-vendored-seo.py

      - name: Production integration gates
        env:
          SEO_CHECKER_PATH: ${{ github.workspace }}/scripts/vendor/workspace-seo/check.py
          PORTAL_SEO_EVIDENCE: "1"
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
        run: pnpm test:e2e

      - name: Upload shared SEO checker report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portal-seo-checker-report
          path: test-results/**/seo-report.json
          if-no-files-found: ignore

  components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build component workspace
        run: pnpm build:storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run component interaction and accessibility gates
        run: pnpm test:storybook

  validate:
    if: ${{ always() }}
    needs: [static, browser, components]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$COMPONENTS_RESULT" = success
