name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit gates
        run: pnpm check
      - name: Audit vulnerabilities
        run: pnpm check:vulnerabilities

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Production integration gates
        run: pnpm test:e2e

      - name: Check out the pinned shared SEO checker
        uses: actions/checkout@v7
        with:
          repository: tiangong-lca/workspace
          ref: dff8180d00f5fbff8155be85ee354e522eb3c554
          sparse-checkout: scripts/seo
          sparse-checkout-cone-mode: false
          path: .seo-checker

      # Opt-in evidence lane: the ownership marker and the shared checker both need an indexable
      # fixture origin, so this step configures one instead of changing the default lane's semantics.
      - name: SEO evidence lane (fixture origin)
        env:
          PORTAL_SEO_EVIDENCE: "1"
          SEO_CHECKER_PATH: ${{ github.workspace }}/.seo-checker/scripts/seo/check.py
          PORTAL_PUBLIC_INDEXING: enabled
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
        run: pnpm test:e2e -- tests/e2e/seo-marker.spec.ts tests/e2e/seo-checker.spec.ts

  components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_EDGE_HMAC_SECRET: portal_bundle_secret_sentinel_v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build component workspace
        run: pnpm build:storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run component interaction and accessibility gates
        run: pnpm test:storybook

  validate:
    if: ${{ always() }}
    needs: [static, browser, components]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$COMPONENTS_RESULT" = success
