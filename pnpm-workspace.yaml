packages:
  - .
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: false
  # Storybook generates its worker explicitly in its own static directory.
  msw: false
overrides:
  # This offline pipeline supports GeoJSON only. Omit the lazily loaded
  # GeoPackage plugin and its obsolete image reader / native SQLite stack.
  "mapshaper>@ngageoint/geopackage": "-"
  # GHSA-7q85-xj36-vmfc: Mapshaper still declares the older ZIP-reader range.
  mapshaper>adm-zip: 0.6.1
  # Storybook uses Vite 8's native path resolution, so tsconfck and its optional
  # TypeScript 5 compiler peer are unused. Portal retains TypeScript 7.
  tsconfck@3.1.6>typescript: "-"
pnpmfile: scripts/pnpm-hooks.cjs
minimumReleaseAgeExclude:
  - "@next/env@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"
  - next@16.3.3
  - skills@1.5.24
  - three@0.186.0
